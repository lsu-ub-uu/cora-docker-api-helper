server {
    include mime.types;

    listen 80;

    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(?:ico|gif|jpe?g|png|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public";
    }
}
